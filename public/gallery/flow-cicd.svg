    <text x="240" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3b0764" text-anchor="middle">Lint &amp; types</text>
    <rect x="196" y="221" width="88" height="38" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="240" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#3b0764" text-anchor="middle">E2E tests</text>
    <text x="240" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">38s</text>
    <text x="240" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">24s</text>
    <text x="240" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">3m 40s · parallel</text>
  </g>
  <g id="step-3">
    <polygon points="336,144 374,180 336,216 298,180" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
