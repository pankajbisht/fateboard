    <polygon points="196,180 189,176 189,184" fill="#64748b"/>
    <polygon points="196,240 189,236 189,244" fill="#64748b"/>
    <path d="M284 120 L290 120 L290 240 L284 240 M284 180 L290 180" stroke="#64748b" stroke-width="2" fill="none"/>
    <polygon points="298,180 291,176 291,184" fill="#64748b"/>
    <path d="M374 180 L404 180 L404 158" stroke="#16a34a" stroke-width="2" fill="none"/>
    <polygon points="404,150 400,158 408,158" fill="#16a34a"/>
    <text x="378" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#16a34a">Yes</text>
    <path d="M428 150 L428 202" stroke="#16a34a" stroke-width="2" fill="none"/>
    <polygon points="428,210 424,202 432,202" fill="#16a34a"/>
    <text x="433" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#64748b">smoke ok</text>
    <path d="M336 216 L336 274" stroke="#dc2626" stroke-width="2" fill="none"/>
    <polygon points="336,282 332,274 340,274" fill="#dc2626"/>
    <text x="342" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#dc2626">No</text>
  </g>
  <g id="step-5">
    <rect x="22" y="262" width="150" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="34" y="281" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155">Last 30 runs</text>
    <rect x="34" y="290" width="6" height="18" rx="1" fill="#22c55e"/>
    <rect x="44" y="294" width="6" height="14" rx="1" fill="#22c55e"/>
    <rect x="54" y="288" width="6" height="20" rx="1" fill="#22c55e"/>
    <rect x="64" y="298" width="6" height="10" rx="1" fill="#ef4444"/>
    <rect x="74" y="292" width="6" height="16" rx="1" fill="#22c55e"/>
    <rect x="84" y="290" width="6" height="18" rx="1" fill="#22c55e"/>
    <rect x="94" y="295" width="6" height="13" rx="1" fill="#22c55e"/>
    <rect x="104" y="289" width="6" height="19" rx="1" fill="#22c55e"/>
    <rect x="114" y="300" width="6" height="8" rx="1" fill="#ef4444"/>
    <rect x="124" y="291" width="6" height="17" rx="1" fill="#22c55e"/>
    <text x="160" y="303" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#16a34a" text-anchor="end">93%</text>
