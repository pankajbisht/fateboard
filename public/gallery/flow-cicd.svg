<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <title>CI/CD Pipeline</title>
  <g id="step-1">
    <rect width="480" height="360" fill="#ffffff"/>
    <text x="24" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">CI/CD pipeline</text>
    <text x="24" y="49" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">runs on every push to main · avg 6 min</text>
    <path d="M100 64 L100 340 M188 64 L188 340 M292 64 L292 340 M382 64 L382 340" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="28" y="66" width="56" height="18" rx="9" fill="#f1f5f9"/>
    <text x="56" y="79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">SOURCE</text>
    <rect x="118" y="66" width="52" height="18" rx="9" fill="#f1f5f9"/>
    <text x="144" y="79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">BUILD</text>
    <rect x="216" y="66" width="48" height="18" rx="9" fill="#f1f5f9"/>
    <text x="240" y="79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">TEST</text>
    <rect x="312" y="66" width="48" height="18" rx="9" fill="#f1f5f9"/>
    <text x="336" y="79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">GATE</text>
    <rect x="398" y="66" width="60" height="18" rx="9" fill="#f1f5f9"/>
    <text x="428" y="79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">RELEASE</text>
  </g>
  <g id="step-2">
    <rect x="18" y="158" width="76" height="44" rx="10" fill="#0f172a"/>
