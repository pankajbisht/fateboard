    <text x="336" y="191" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">green?</text>
    <rect x="388" y="110" width="80" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="428" y="127" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Deploy</text>
    <text x="428" y="141" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">staging</text>
    <rect x="388" y="210" width="80" height="40" rx="10" fill="#16a34a"/>
    <text x="428" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Production</text>
    <rect x="404" y="258" width="48" height="16" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="428" y="270" font-family="Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">v2.4.1</text>
    <rect x="276" y="282" width="120" height="36" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="336" y="304" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">Notify &amp; block merge</text>
  </g>
