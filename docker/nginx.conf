# Static hosting that matches GitHub Pages: `/help` serves help.html (HTTP 200), unknown URLs get the
# 404.html app shell with status 404, hashed assets are cached for a year.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
