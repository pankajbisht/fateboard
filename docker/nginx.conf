# Static hosting that matches GitHub Pages: `/help` serves help.html (HTTP 200), unknown URLs get the
# 404.html app shell with status 404, hashed assets are cached for a year.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # header-only protections a <meta> CSP cannot give (BUG-165); repeated per location because a
        # location's add_header replaces the server-level list
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        # header-only protections a <meta> CSP cannot give (BUG-165); repeated per location because a
        # location's add_header replaces the server-level list
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    error_page 404 /404.html;
}
