# CI/CD for fateboard (docs/ARCHITECTURE.md "Deploy", docs/TESTING.md "CI").
# This file only wires the pipeline; each stage is a reusable workflow:
#
#   quality.yml ─┐
#   e2e.yml ─────┼─> ci (single required check) ─> deploy.yml (push to main only)
#   build.yml ───┘
#
# Shared Node setup: .github/actions/setup-node-deps. Third-party actions are pinned to
# full commit SHAs (tag in the trailing comment); Dependabot keeps them current.
name: CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Least privilege by default; only the deploy job widens it.
permissions:
    contents: read

# One run per ref: a new push to a PR cancels the stale run. Runs on main are never
# cancelled mid-way (deploy.yml has its own `pages` group as well).
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        uses: ./.github/workflows/quality.yml

    e2e:
        uses: ./.github/workflows/e2e.yml

    build:
        uses: ./.github/workflows/build.yml

    # Single status to mark "required" in branch protection, so adding/renaming stages
    # never needs a settings change.
    ci:
        name: CI passed
        if: ${{ always() }}
        needs: [quality, e2e, build]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check job results
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "Job results: $RESULTS"
                  for r in $RESULTS; do
                      [ "$r" = "success" ] || { echo "::error::A required job did not succeed ($r)"; exit 1; }
                  done

    # Only a push to main (never a PR, BUG-057), only after every gate is green.
    deploy:
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        needs: ci
        permissions:
            pages: write
            id-token: write
        uses: ./.github/workflows/deploy.yml
