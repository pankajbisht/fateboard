# Reusable: fast static gates + unit tests. Called by ci.yml.
name: Quality

on:
    workflow_call:

permissions:
    contents: read

jobs:
    quality:
        name: Lint, types, unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps

            # Supply chain: registry signatures/provenance of every installed package.
            - name: Verify package signatures
              run: npm audit signatures

            # Runtime deps only; dev-tool advisories are handled by Dependabot (BUG-136).
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

            # Coverage thresholds in vitest.config.ts fail this step on a regression.
            - name: Unit tests with coverage
              run: npm run test:coverage

            - name: Upload coverage report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: coverage
                  retention-days: 14
