# Reusable: production bundle, uploaded as the Pages artifact that deploy.yml publishes.
# Called by ci.yml (on PRs too, so a broken build is caught before merge).
name: Build

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        name: Production build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps

            # --ignore-scripts skips `prebuild` (type-check already runs in quality.yml);
            # `build` itself still runs `tsc -b && vite build`.
            - name: Build
              run: npm run build --ignore-scripts
              env:
                  # Google Analytics id (repo Settings > Variables); empty = analytics off (BUG-131)
                  VITE_GA_ID: ${{ vars.VITE_GA_ID }}

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist
                  retention-days: 7
