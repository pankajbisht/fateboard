# Reusable (called by web-ci.yml as "Quality"): static gates and unit tests, as two parallel jobs
# so a red check names the gate that failed.
name: Quality

on:
    workflow_call:

permissions:
    contents: read

# Every `run:` step works inside the web app (its own package.json, lockfile and .nvmrc).
defaults:
    run:
        working-directory: apps/web

jobs:
    static-analysis:
        name: Static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # the PR merge commit + its first parent (the base branch tip) for the guardrails check
                  fetch-depth: 2

            # Guardrails (docs/AGENT_WORKFLOW.md): a PR may not loosen a ratchet (lint limit, coverage thresholds,
            # size ceilings) or remove a public store key. The owner approves one by adding the PR label
            # `ratchet-change` or `api-change`, then re-runs this job.
            - name: Guardrails (ratchets, store API)
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  ALLOW_RATCHET_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'ratchet-change') && '1' || '0' }}
                  ALLOW_API_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'api-change') && '1' || '0' }}
              run: node scripts/guardrails/check-ratchets.mjs HEAD^1

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps
              with:
                  app-dir: apps/web

            # Supply chain: registry signatures/provenance of every installed package.
            - name: Verify package signatures
              run: npm audit signatures

            # Runtime deps only; dev-tool advisories are handled by Dependabot (BUG-136).
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

    # Sharded (docs/TESTING.md "Speed"): the unit files are split over parallel jobs, each writing a Vitest blob
    # report with its coverage; `unit-coverage` merges them and checks the coverage ratchet once, over the whole run
    # (a shard skips the ratchet: vitest.config.ts). To rebalance, change `shard` and `shard-total` together.
    unit-tests:
        name: Unit tests (shard ${{ matrix.shard }}/${{ matrix.shard-total }})
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            # run every shard to the end: one red shard must not hide failures in the others
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
                shard-total: [3]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps
              with:
                  app-dir: apps/web

            - name: Unit tests with coverage (one shard)
              env:
                  SHARD: ${{ matrix.shard }}/${{ matrix.shard-total }}
              run: npm run test:shard -- --shard="$SHARD"

            - name: Upload shard report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: vitest-blob-${{ matrix.shard }}of${{ matrix.shard-total }}
                  path: apps/web/.vitest/blob # artifact paths are relative to the checkout
                  include-hidden-files: true # .vitest is a dot folder, skipped by default
                  if-no-files-found: error
                  retention-days: 1

    unit-coverage:
        name: Unit tests (coverage)
        needs: unit-tests
        # merge whatever the shards produced, so a red shard still gives a coverage report
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps
              with:
                  app-dir: apps/web

            - name: Download shard reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: vitest-blob-*
                  path: apps/web/.vitest/blob
                  merge-multiple: true

            # Fails on any failed test of any shard and when coverage drops below the thresholds in vitest.config.ts.
            - name: Merge reports and check the coverage ratchet
              run: npm run test:merge

            - name: Upload coverage report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: apps/web/coverage
                  retention-days: 14
