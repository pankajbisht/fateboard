# Reusable (called by ci.yml as "Build"): build the self-hosting image and check that it serves
# the app (BUG-135). Layers are cached in the GitHub Actions cache, so `npm ci` inside the image
# only reruns when package*.json / .npmrc change.
name: Build container image

on:
    workflow_call:

permissions:
    contents: read

jobs:
    container-image:
        name: Container image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              env:
                  DOCKER_BUILD_RECORD_UPLOAD: 'false' # no extra build-record artifact per run
              with:
                  context: . # the checkout (honours .dockerignore), not a fresh git clone
                  load: true # into the local daemon for the smoke test
                  push: false
                  tags: fateboard:ci
                  build-args: |
                      VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
                  cache-from: type=gha,scope=fateboard-image
                  cache-to: type=gha,mode=max,scope=fateboard-image

            - name: Smoke test (routes, 404, non-root)
              run: |
                  docker run -d --name fb -p 8080:8080 fateboard:ci
                  for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/help)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/draw)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = 404
                  test "$(docker exec fb id -u)" != 0
                  docker rm -f fb
