# Reusable (called by ci.yml as "Quality"): static gates and unit tests, as two parallel jobs
# so a red check names the gate that failed.
name: Quality

on:
    workflow_call:

permissions:
    contents: read

jobs:
    static-analysis:
        name: Static analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # the PR merge commit + its first parent (the base branch tip) for the guardrails check
                  fetch-depth: 2

            # Guardrails (docs/AGENT_WORKFLOW.md): a PR may not loosen a ratchet (lint limit, coverage thresholds,
            # size ceilings) or remove a public store key. The owner approves one by adding the PR label
            # `ratchet-change` or `api-change`, then re-runs this job.
            - name: Guardrails (ratchets, store API)
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  ALLOW_RATCHET_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'ratchet-change') && '1' || '0' }}
                  ALLOW_API_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'api-change') && '1' || '0' }}
              run: node scripts/guardrails/check-ratchets.mjs HEAD^1

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps

            # Supply chain: registry signatures/provenance of every installed package.
            - name: Verify package signatures
              run: npm audit signatures

            # Runtime deps only; dev-tool advisories are handled by Dependabot (BUG-136).
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

    unit-tests:
        name: Unit tests (coverage)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps

            # Coverage thresholds in vitest.config.ts fail this step on a regression.
            - name: Unit tests with coverage
              run: npm run test:coverage

            - name: Upload coverage report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: coverage
                  retention-days: 14
