# Reusable: build the self-hosting image and check that it serves the app (BUG-135). Called by ci.yml.
name: Docker

on:
    workflow_call:

permissions:
    contents: read

jobs:
    docker:
        name: Docker image (build + smoke)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build image
              env:
                  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
              run: docker build --build-arg VITE_SITE_URL="$VITE_SITE_URL" -t fateboard:ci .

            - name: Smoke test (routes, 404, non-root)
              run: |
                  docker run -d --name fb -p 8080:8080 fateboard:ci
                  for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/help)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/draw)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = 404
                  test "$(docker exec fb id -u)" != 0
                  docker rm -f fb
