# Reusable: end-to-end tests (Playwright) against a production-like bundle
# (vite build --mode e2e, see playwright.config.ts). Called by ci.yml.
name: E2E

on:
    workflow_call:

permissions:
    contents: read

jobs:
    e2e:
        name: E2E (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CI: true
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Read Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            # Browser binaries are keyed by the exact Playwright version (~150 MB saved per run).
            - name: Cache Playwright browsers
              id: pw-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

            - name: Install Chromium + system deps
              if: steps.pw-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            # Cache hit: binaries are restored, but OS libraries still need installing.
            - name: Install system deps only
              if: steps.pw-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: End-to-end tests
              run: npm run e2e

            - name: Upload Playwright report
              if: ${{ failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 14
